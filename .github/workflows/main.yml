name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install ClawHub
        run: npm install -g clawhub

      - name: Check ClawHub
        run: clawhub --version

      - name: Install Skill (FIX)
        run: clawhub install verified-agent-identity --force

      - name: Install dependencies
        run: |
          cd scripts || exit 1
          npm install

      - name: Create Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge "{\"name\": \"limitzaja\", \"description\": \"limitzaja AI Agent\"}"
